<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hũ Nợ Tương Trợ - Cùng Nhau Gỡ Rối</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Canvas Confetti cho hiệu ứng bom nổ -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Container chính -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-[85vh]">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-red-600 to-orange-600 p-6 text-center text-white relative">
            <h1 class="text-2xl font-black tracking-wider uppercase">Hũ Tương Trợ 💣</h1>
            <p class="text-xs text-orange-100 mt-1 opacity-90">Lan tỏa sự tử tế - Gỡ rối tài chính</p>
            <button onclick="resetRole()" class="absolute top-4 right-4 text-[10px] bg-black/30 hover:bg-black/50 px-2 py-1 rounded-full transition text-slate-200">Đổi vai trò</button>
        </header>

        <!-- Dynamic Content Area -->
        <main id="app-content" class="p-5 flex-1 flex flex-col justify-between">
            <!-- Nội dung render bằng JS -->
        </main>

        <!-- Footer -->
        <footer class="bg-slate-950/50 py-3 px-6 text-center text-xs text-slate-500 border-t border-slate-800/60">
            Hệ thống Tương trợ Cộng đồng &copy; 2026
        </footer>
    </div>

    <!-- JavaScript Xử Lý Toàn Bộ App -->
    <script>
        let currentRole = localStorage.getItem('app_role') || null;
        let hasAgreedTerms = localStorage.getItem('app_terms') === 'true';

        let hũNợList = JSON.parse(localStorage.getItem('hũ_nợ_list')) || [
            {
                id: 1,
                name: "Nguyễn Văn A",
                cccd: "079203xxxxxx (Đã duyệt ✅)",
                stk: "MB Bank - 0987xxxxxx",
                reason: "Mắc kẹt tiền nhà trọ tháng này do kẹt vốn buôn bán nhỏ.",
                target: 500000,
                current: 400000,
                createdAt: new Date().getTime(),
                status: 'active',
                donors: [
                    { name: "Trần Quân", amount: 400000, phone: "0912xxxxxx" }
                ],
                connectedPhones: []
            }
        ];

        function renderApp() {
            const container = document.getElementById('app-content');
            
            if (!hasAgreedTerms) {
                container.innerHTML = renderTermsScreen();
                return;
            }

            if (!currentRole) {
                container.innerHTML = renderRoleSelector();
                return;
            }

            if (currentRole === 'borrower') {
                container.innerHTML = renderBorrowerDashboard();
            } else if (currentRole === 'donor') {
                container.innerHTML = renderDonorDashboard();
            }
        }

        function renderTermsScreen() {
            return `
                <div class="space-y-4 flex flex-col h-full justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-orange-500 mb-2 flex items-center gap-2">
                            <span>📜</span> ĐIỀU KHOẢN & CAM KẾT HOẠT ĐỘNG
                        </h2>
                        <div class="space-y-2.5 text-xs text-slate-300 max-h-[48vh] overflow-y-auto pr-1 bg-slate-950/40 p-3 rounded-xl border border-slate-800">
                            <p>1. <strong>Phí lọc hồ sơ (50k):</strong> Phí 50k khởi tạo hũ là phí thẩm định, <strong>không hoàn trả</strong> dưới mọi hình thức.</p>
                            <p>2. <strong>Trách nhiệm pháp lý:</strong> Chủ web chịu hoàn toàn trách nhiệm trước pháp luật nếu lợi dụng web lừa đảo.</p>
                            <p>3. <strong>Quyền thu hồi/đổi hũ (72h):</strong> Người cho vay có quyền đổi người nhận hoặc nhận lại số tiền nếu sau 72 giờ hũ chưa đầy.</p>
                            <p>4. <strong>Kết nối nhân văn:</strong> Sau khi bom nổ, người cho và người nhận có thể tùy chọn chia sẻ số điện thoại để liên lạc, cảm ơn trực tiếp.</p>
                        </div>
                    </div>

                    <button onclick="acceptTerms()" class="w-full bg-gradient-to-r from-orange-500 to-red-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95 text-sm">
                        Tôi đã đọc và Đồng ý cam kết ✅
                    </button>
                </div>
            `;
        }

        function acceptTerms() {
            hasAgreedTerms = true;
            localStorage.setItem('app_terms', 'true');
            renderApp();
        }

        function renderRoleSelector() {
            return `
                <div class="flex flex-col justify-center items-center h-full py-10 space-y-6 text-center">
                    <div class="space-y-2">
                        <h2 class="text-xl font-bold text-white">Bạn tham gia với tư cách gì?</h2>
                        <p class="text-xs text-slate-400">Khóa cố định trên thiết bị này.</p>
                    </div>

                    <div class="w-full space-y-4">
                        <button onclick="selectRole('borrower')" class="w-full bg-slate-800 border border-slate-700 p-5 rounded-2xl flex items-center justify-between group transition">
                            <div class="text-left">
                                <div class="font-bold text-orange-400 text-base">Người Mang Nợ (Người Xin)</div>
                                <div class="text-xs text-slate-400 mt-0.5">Tạo hũ & Theo dõi tiến trình nhận tiền</div>
                            </div>
                            <span class="text-2xl">🛡️</span>
                        </button>

                        <button onclick="selectRole('donor')" class="w-full bg-slate-800 border border-slate-700 p-5 rounded-2xl flex items-center justify-between group transition">
                            <div class="text-left">
                                <div class="font-bold text-emerald-400 text-base">Người Trả Nợ (Thùng Công Đức)</div>
                                <div class="text-xs text-slate-400 mt-0.5">Gieo duyên qua QR TKNH tự động</div>
                            </div>
                            <span class="text-2xl">🎁</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function selectRole(role) {
            currentRole = role;
            localStorage.setItem('app_role', role);
            renderApp();
        }

        function resetRole() {
            const pin = prompt("Nhập mã bảo vệ đổi vai trò (Mặc định: 1234):");
            if (pin === "1234") {
                localStorage.removeItem('app_role');
                currentRole = null;
                renderApp();
            }
        }

        function renderBorrowerDashboard() {
            let myHu = hũNợList[0];
            let percent = Math.min(100, Math.round((myHu.current / myHu.target) * 100));

            let connectionsHTML = myHu.connectedPhones.map(phone => `
                <div class="flex justify-between items-center text-xs py-1.5 border-b border-slate-800">
                    <span class="text-slate-300">📞 SĐT Ân Nhân: <b>${phone}</b></span>
                    <a href="tel:${phone}" class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded font-bold">Gọi ngay</a>
                </div>
            `).join('') || '<p class="text-xs text-slate-500">Chưa có kết nối số điện thoại nào.</p>';

            return `
                <div class="space-y-4 flex flex-col justify-between h-full">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <h2 class="font-bold text-sm text-orange-400 flex items-center gap-1.5">
                                <span>📊</span> Tiến Trình Nhận Tiền Của Bạn
                            </h2>
                            <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-medium">Đã duyệt STK ✅</span>
                        </div>

                        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-2xl space-y-3">
                            <div class="flex justify-between text-xs">
                                <span class="text-slate-400">Đã nhận / Mục tiêu:</span>
                                <span class="font-bold text-white">${myHu.current.toLocaleString()}đ / ${myHu.target.toLocaleString()}đ (${percent}%)</span>
                            </div>
                            <div class="w-full bg-slate-950 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700">
                                <div class="bg-gradient-to-r from-orange-500 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                            </div>
                            <div class="text-[11px] text-slate-400 flex justify-between pt-1 border-t border-slate-700/50">
                                <span>Trạng thái: <strong class="${myHu.status === 'success' ? 'text-emerald-400' : 'text-orange-400'}">${myHu.status === 'success' ? '💥 ĐÃ NỔ BOM THÀNH CÔNG' : 'Đang gom quỹ'}</strong></span>
                                <span class="text-emerald-400 font-semibold">STK: ${myHu.stk}</span>
                            </div>
                        </div>

                        <!-- Danh sách số điện thoại ân nhân kết nối -->
                        <div class="mt-3 bg-slate-950/50 border border-slate-800 p-3 rounded-xl">
                            <div class="text-xs font-bold text-slate-300 mb-2">🤝 SĐT Ân Nhân Đã Kết Nối:</div>
                            <div class="max-h-28 overflow-y-auto space-y-1">
                                ${connectionsHTML}
                            </div>
                        </div>
                    </div>

                    <button onclick="openCreateHuModal()" class="w-full bg-slate-800 hover:bg-slate-750 text-orange-400 border border-orange-500/30 text-xs font-semibold py-2.5 rounded-xl transition">
                        + Tạo Hũ Mới (Phí lọc 50k)
                    </button>
                </div>
            `;
        }

        function openCreateHuModal() {
            let name = prompt("Nhập họ và tên thật (trên CCCD):");
            if(!name) return;
            let cccd = prompt("Nhập số CCCD chính chủ:");
            if(!cccd) return;
            let stk = prompt("Nhập Ngân hàng + Số tài khoản nhận tiền:");
            if(!stk) return;
            let target = parseInt(prompt("Nhập số tiền cần xin (Tối đa 2.000.000đ):", "500000"));
            if(isNaN(target) || target > 2000000) return alert("Số tiền không hợp lệ!");
            let reason = prompt("Nhập hoàn cảnh khó khăn của bạn:");

            let confirmPay = confirm(`Xác nhận nộp 50.000đ phí lọc hồ sơ (không hoàn trả) để kích hoạt hũ?`);
            if(!confirmPay) return;

            let newHu = {
                id: Date.now(),
                name: name,
                cccd: cccd + " (Đã duyệt ✅)",
                stk: stk,
                reason: reason,
                target: target,
                current: 0,
                createdAt: new Date().getTime(),
                status: 'active',
                donors: [],
                connectedPhones: []
            };

            hũNợList.unshift(newHu);
            localStorage.setItem('hũ_nợ_list', JSON.stringify(hũNợList));
            alert("🎉 Khởi tạo thành công! Tiến trình nhận tiền đã sẵn sàng.");
            renderApp();
        }

        function renderDonorDashboard() {
            let listHTML = hũNợList.map(hũ => {
                let percent = Math.min(100, Math.round((hũ.current / hũ.target) * 100));
                return `
                    <div class="bg-slate-800/80 border border-slate-700/60 p-4 rounded-2xl space-y-2.5">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-bold text-white text-sm flex items-center gap-1">
                                    ${hũ.name} 
                                    <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded">✔ CCCD thật</span>
                                </div>
                                <div class="text-[11px] text-slate-400 mt-0.5">${hũ.reason}</div>
                            </div>
                            <span class="text-xs font-bold text-orange-400">${percent}%</span>
                        </div>

                        <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r from-orange-500 to-emerald-400 h-full rounded-full" style="width: ${percent}%"></div>
                        </div>

                        <div class="flex justify-between items-center text-[11px] text-slate-400 pt-1">
                            <span>Đã nhận: <b class="text-white">${hũ.current.toLocaleString()}đ</b> / ${hũ.target.toLocaleString()}đ</span>
                            <button onclick="payViaBankQR(${hũ.id})" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow transition active:scale-95">
                                Gieo Duyên (QR TKNH) 💳
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-3 flex flex-col h-full justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <h2 class="font-bold text-sm text-emerald-400 flex items-center gap-1.5">
                                <span>🎁</span> Thùng Công Đức (Tương Trợ)
                            </h2>
                            <span class="text-[10px] text-slate-400">Quét QR tự động trừ tiền</span>
                        </div>

                        <div class="space-y-3 max-h-[55vh] overflow-y-auto pr-1">
                            ${listHTML}
                        </div>
                    </div>

                    <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-xl text-[11px] text-slate-400">
                        💡 <strong>Tính năng mới:</strong> Khi bom nổ hoàn thành, bạn có thể tùy chọn chia sẻ số điện thoại liên lạc để người nhận gửi lời cảm ơn trực tiếp!
                    </div>
                </div>
            `;
        }

        function payViaBankQR(id) {
            let hu = hũNợList.find(h => h.id === id);
            let donorName = prompt("Nhập tên hiển thị của bạn:", "Mạnh thường quân");
            let amount = parseInt(prompt("Nhập số tiền muốn chuyển (VNĐ):", "100000"));
            if(!amount || isNaN(amount)) return;

            let confirmQR = confirm(`📲 Đang tạo VietQR chuyển khoản tự động...\n\n- Số tiền: ${amount.toLocaleString()}đ\n- Nội dung: Gieo duyên hũ ${hu.id}\n\nBấm [OK] để xác nhận đã thanh toán thành công.`);
            
            if(confirmQR) {
                hu.current += amount;
                
                // Kiểm tra nếu chạm mốc đủ tiền -> Kích hoạt bom nổ & Tùy chọn SĐT
                if (hu.current >= hu.target && hu.status !== 'success') {
                    hu.current = hu.target;
                    hu.status = 'success';
                    triggerBombEffect();
                    
                    alert(`🎉 Hũ của ${hu.name} đã đủ 100%!\n💥 KÍCH HOẠT BƠM NỔ: Tự động chuyển toàn bộ tiền vào STK ${hu.stk}`);

                    // Hỏi ý kiến chia sẻ SĐT
                    let sharePhone = confirm("❤️ Bạn có muốn chia sẻ Số Điện Thoại của mình cho người nhận này để họ gửi lời cảm ơn trực tiếp không?");
                    if (sharePhone) {
                        let phoneInput = prompt("Nhập số điện thoại liên lạc của bạn:", "09");
                        if (phoneInput) {
                            hu.connectedPhones.push(phoneInput);
                            alert("Đã gửi số điện thoại kết nối thành công tới người nhận!");
                        }
                    }
                } else {
                    alert(`❤️ Giao dịch thành công! Đã đóng góp ${amount.toLocaleString()}đ vào hũ.`);
                }

                localStorage.setItem('hũ_nợ_list', JSON.stringify(hũNợList));
                renderApp();
            }
        }

        function triggerBombEffect() {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        }

        renderApp();
    </script>
</body>
</html>
